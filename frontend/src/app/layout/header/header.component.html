<header class="site-header">
  <a routerLink="/" class="site-header__brand">
    <svg class="site-header__mark" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M12 2.3 L20.6 9.3 V14.6 C20.6 19.2 16.9 22.2 12 22.2 C7.1 22.2 3.4 19.2 3.4 14.6 V9.3 L12 2.3 Z M12 8.1 A2.6 2.6 0 1 0 12.01 8.1 Z"
      />
    </svg>
    <span>Market Propiedades</span>
  </a>

  <div class="site-header__right">
    <nav class="site-header__nav">
      <a routerLink="/publicar" class="site-header__publicar"> ¿Quieres publicar tu propiedad? </a>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      @if (themeService.theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </div>
</header>
